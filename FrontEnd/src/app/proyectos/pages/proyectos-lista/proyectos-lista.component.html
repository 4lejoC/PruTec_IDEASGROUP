<section class="cabecera">
  <h1 class="cabecera__titulo">Proyectos</h1>

  <button mat-flat-button color="primary">
    <mat-icon>add</mat-icon>
    Nuevo proyecto
  </button>
</section>

<section class="glass-panel muestra">
  <p class="muestra__titulo">Vista previa del sistema de diseño</p>
  <div class="muestra__badges">
    <span class="badge" style="--badge-color: var(--estado-planificado)">Planificado</span>
    <span class="badge" style="--badge-color: var(--estado-en-curso)">En curso</span>
    <span class="badge" style="--badge-color: var(--estado-pausado)">Pausado</span>
    <span class="badge" style="--badge-color: var(--estado-finalizado)">Finalizado</span>
    <span class="badge" style="--badge-color: var(--estado-cancelado)">Cancelado</span>
  </div>
  <div class="muestra__badges">
    <span class="badge" style="--badge-color: var(--prioridad-baja)">Baja</span>
    <span class="badge" style="--badge-color: var(--prioridad-media)">Media</span>
    <span class="badge" style="--badge-color: var(--prioridad-alta)">Alta</span>
    <span class="badge" style="--badge-color: var(--prioridad-critica)">Crítica</span>
  </div>
</section>
