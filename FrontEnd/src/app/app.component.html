<!-- Fondo plano con formas de color sólido: lo que el vidrio desenfoca -->
<div class="app-background" aria-hidden="true">
  <span class="app-background__forma app-background__forma--lavanda"></span>
  <span class="app-background__forma app-background__forma--durazno"></span>
  <span class="app-background__forma app-background__forma--menta"></span>
</div>

<header class="toolbar">
  <div class="toolbar__contenido">
    <a class="marca" routerLink="/">
      <span class="marca__logo" aria-hidden="true">
        <mat-icon>task_alt</mat-icon>
      </span>
      <span class="marca__texto">{{ titulo }}</span>
    </a>

    <div class="toolbar__acciones">
      <button
        mat-icon-button
        class="boton-tema"
        (click)="temaService.alternar($event)"
        [attr.aria-label]="temaService.tema() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'"
        [attr.title]="temaService.tema() === 'claro' ? 'Modo oscuro' : 'Modo claro'">
        @if (temaService.tema() === 'claro') {
          <mat-icon class="girar-entrar">dark_mode</mat-icon>
        } @else {
          <mat-icon class="girar-entrar">light_mode</mat-icon>
        }
      </button>
    </div>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>
