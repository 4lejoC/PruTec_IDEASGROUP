<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión de Tareas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeaf3">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplica el tema guardado antes de que cargue Angular, para evitar un parpadeo de colores. -->
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('gestion-tareas.tema'); } catch (e) {}
      if (tema !== 'claro' && tema !== 'oscuro') {
        tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      }
      document.documentElement.setAttribute('data-tema', tema);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
